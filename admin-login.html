<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Coding Protocol</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-page">
  <div class="glass login-card">
    <p class="login-wordmark">Coding Protocol</p>
    <p class="login-role">Admin Portal</p>

    <span id="errorMsg" class="error-msg"></span>

    <div class="input-field">
      <input id="adminUser" type="text" placeholder="Username" autocomplete="username">
    </div>
    <div class="input-field">
      <input id="adminPass" type="password" placeholder="Password" autocomplete="current-password">
      <button class="eye-btn" id="eyeBtn" type="button">👁</button>
    </div>

    <button id="loginBtn" class="btn btn-primary btn-full" style="margin-top:10px;padding:13px;">
      Sign In →
    </button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="three-bg.js"></script>
<script type="module" src="admin-login.js"></script>
</body>
</html>
